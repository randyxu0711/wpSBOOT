[project]
name = "wpsboot"
version = "2.0.0"
description = "wpSBOOT web server: build Super-MSAs from multiple aligners"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
wpsboot-worker = "wpsboot.worker:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpsboot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S603", "S607"]  # subprocess with argument lists is the whole point of the worker

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"migrations/**" = ["E501"]
"src/wpsboot/examples.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database (DATABASE_URL)",
    "tools: needs the real aligners and BioPerl on PATH",
]
