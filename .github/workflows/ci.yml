name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
        env:
          SECRET_KEY: ci-secret-key-0123456789

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create CI environment file
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=ci-secret-key-0123456789/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/" .env
      - name: Build images
        run: |
          docker compose -f compose.yaml build web worker
          docker compose -f compose.yaml --profile test build test
      - name: Run tests (including real aligners)
        run: docker compose -f compose.yaml --profile test run --rm test pytest -p no:cacheprovider
      - name: Smoke test the stack
        run: |
          docker compose -f compose.yaml up -d web worker
          for i in $(seq 1 30); do
            docker compose -f compose.yaml exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')" && break
            sleep 2
          done
          docker compose -f compose.yaml exec -T web python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --tail 200
